name: Merge commentary

# Only commentary and its run log may auto-merge. Log-only updates do not
# refresh data. GITHUB_TOKEN merges need an explicit rebuild dispatch.
on:
  pull_request:
    types: [opened, labeled, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write

# Events for one PR must inspect live state one at a time. Never interrupt a
# merge between committing it and dispatching its publication.
concurrency:
  group: commentary-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    if: contains(github.event.pull_request.labels.*.name, 'commentary')
    runs-on: ubuntu-latest
    steps:
      # Execute trusted main code, never code from the proposed PR.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge eligible open PR and publish only changed commentary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python tools/delivery.py merge-commentary --repo "$REPO" --pr "$PR_NUMBER"
