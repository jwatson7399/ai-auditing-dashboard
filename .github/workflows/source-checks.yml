name: Public source checks
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'site/template.html'
      - 'tests/test_*.py'
      - '.github/workflows/source-checks.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parser and fallback tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Fetch public tables without secrets
        run: python tools/check_public_sources.py --output /tmp/auditor-source-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-source-probes
          path: /tmp/auditor-source-check/data/raw
          if-no-files-found: ignore
