name: Daily rebuild

# Scheduled firings arrive hours late: between September 10 and 20, 2026 the
# single 12:15 UTC entry was created 3.2 to 5.8 hours after its time, so the
# numbers never landed before 9am ET on their own. The entries below are
# staggered so that, with that lag, at least one lands before the Commentator
# wakes. The first firing that finds no usable data for today's Eastern date
# fetches; tools/delivery.py plan-rebuild turns the rest into a logged skip.
# Every entry is after midnight in New York in both daylight and standard time,
# so nothing here needs changing when the clocks change.
# Also runs when agent files land on main, and by hand.
on:
  schedule:
    - cron: "15 6 * * *"
    - cron: "15 8 * * *"
    - cron: "15 10 * * *"
    - cron: "15 12 * * *"
  push:
    branches: [main]
    paths:
      - "inbox/commentary/**"
      # The page reads only today's dated file from each of these, and a
      # scheduled firing skips once today has data, so without these a merged
      # Scout, Verifier or Editor file would not show until tomorrow's fetch.
      - "inbox/benchmarks/**"
      - "inbox/news/**"
      - "inbox/verified/**"
  workflow_dispatch:
    inputs:
      no_fetch:
        description: "Rebuild from the last data file without fetching"
        type: boolean
        default: false
      ensure_daily:
        description: "Fetch only if today has no usable committed refresh"
        type: boolean
        default: false

concurrency:
  group: rebuild
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # AA_API_KEY belongs to this environment, whose deployment branch policy
    # admits main only. A run started on any other ref cannot read the key.
    environment: data-fetch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether today already has data
        id: plan
        env:
          ENSURE_DAILY: ${{ inputs.ensure_daily }}
          NO_FETCH: ${{ inputs.no_fetch }}
        run: python tools/delivery.py plan-rebuild

      - name: Install
        if: steps.plan.outputs.run == 'true'
        run: |
          pip install --quiet requests openpyxl playwright
          python -m playwright install --with-deps chromium

      - name: Rebuild
        id: rebuild
        if: steps.plan.outputs.run == 'true'
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if [ "${{ inputs.no_fetch }}" = "true" ]; then
            python tools/rebuild.py --no-fetch
          else
            python tools/rebuild.py
          fi
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit data, page, and log
        # Always run: a skipped firing still has a log line to commit, or the
        # schedule looks like it never ran. Rebuild failures still record too.
        # On fetch failure site/index.html is untouched and the old page stays up.
        run: |
          git config user.name "daily-rebuild"
          git config user.email "daily-rebuild@users.noreply.github.com"
          git add data log site/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ "${{ steps.plan.outputs.run }}" = "true" ]; then
            git commit -m "Daily rebuild $(date -u +%Y-%m-%d) (run ${{ github.run_number }})"
          else
            git commit -m "Rebuild skipped $(date -u +%Y-%m-%d) (run ${{ github.run_number }})"
          fi
          # main can move while this job runs (a merged agent PR). Agents write
          # under inbox/ and their own log file; this job writes data/, site/
          # and log/runs-rebuild.csv, so replaying onto the new tip is clean.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "could not push the rebuild commit after 3 attempts"
          exit 1

      - name: Upload page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Fail the run if the rebuild failed
        if: steps.plan.outputs.run == 'true' && steps.rebuild.outputs.rc != '0'
        run: |
          echo "rebuild exited ${{ steps.rebuild.outputs.rc }}; see log/runs-rebuild.csv"
          exit 1

  deploy:
    needs: rebuild
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
